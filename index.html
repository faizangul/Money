<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Money Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1614" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* On-device storage for the standalone Money Tracker.
   Provides the same small store interface the app uses (doc/collection, set/add/delete, onSnapshot),
   kept in SQLite in the iOS app (native MoneyStore plugin) or in localStorage in a browser,
   plus backup and restore through files. */
(function(){
"use strict";
/* Inside Claude, window.claude is Claude's own storage: leave it, and everything below, alone */
if(window.claude&&typeof window.claude.use==="function")return;
const KEY="mt.store.v1",META="mt.meta.v1";
let store={},meta={},storageOk=true;
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform()&&CAP.nativePromise);
const sql=(m,o)=>CAP.nativePromise("MoneyStore",m,o||{});
const rows=s=>Object.keys(s).map(p=>({p,d:JSON.stringify(s[p])}));
/* native calls run one after another, so saves land in the order they were made */
let tail=Promise.resolve();
const chain=f=>{const r=tail.then(f);tail=r.catch(()=>{});return r};
/* Storage backends. Both keep the whole store in memory; these calls make the saved copy match it.
   load() resolves {store,meta,ok}; write, replaceAll and saveMeta reject if nothing was saved. */
const lsSave=all=>{try{localStorage.setItem(KEY,JSON.stringify(all));return Promise.resolve()}catch(e){return Promise.reject({code:"quota_exceeded",message:"Phone storage is full"})}};
/* web (GitHub Pages): localStorage under the same keys every earlier version used, so data carries over as it is */
const webBackend={
  async load(){
    try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
    let s={},m={},ok=true;
    try{s=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){ok=false;s={}}
    try{m=JSON.parse(localStorage.getItem(META)||"{}")||{}}catch(e){m={}}
    return{store:s,meta:m,ok};
  },
  write:(p,next,all)=>lsSave(all),
  replaceAll:lsSave,
  saveMeta(m){try{localStorage.setItem(META,JSON.stringify(m))}catch(e){}return Promise.resolve()}
};
/* iOS app: SQLite through the native MoneyStore plugin */
const iosBackend={
  async load(){
    const r=await sql("load"),s={};let m={};
    (r.docs||[]).forEach(x=>{s[x.p]=JSON.parse(x.d)});
    try{m=JSON.parse((r.values||{}).meta||"{}")||{}}catch(e){m={}}
    /* first launch on SQLite: move over anything an earlier build kept in localStorage */
    let old=null;try{old=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
    if(!Object.keys(s).length&&old&&typeof old==="object"&&Object.keys(old).length){
      try{m=JSON.parse(localStorage.getItem(META)||"{}")||{}}catch(e){m={}}
      await iosBackend.replaceAll(old);await iosBackend.saveMeta(m);
      try{localStorage.removeItem(KEY);localStorage.removeItem(META)}catch(e){}
      return{store:old,meta:m,ok:true};
    }
    try{localStorage.removeItem(KEY);localStorage.removeItem(META)}catch(e){}
    return{store:s,meta:m,ok:true};
  },
  write:(p,next)=>chain(()=>sql("write",next===undefined?{dels:[p]}:{puts:[{p,d:JSON.stringify(next)}]})),
  replaceAll:next=>chain(()=>sql("replaceAll",{docs:rows(next)})),
  saveMeta:m=>chain(()=>sql("setValue",{k:"meta",v:JSON.stringify(m)}))
};
const backend=NATIVE?iosBackend:webBackend;
/* small secrets (PIN lock): iOS Keychain in the app, localStorage in a browser. Loaded once at start
   so reads stay instant; an older build's localStorage copy moves into the Keychain once. */
const SECRET_KEYS=["mt.pin","mt.pintries"],secrets={};
const kc=(m,o)=>CAP.nativePromise("SecureStore",m,o);
async function loadSecrets(){
  for(const k of SECRET_KEYS){
    let old=null;try{old=localStorage.getItem(k)}catch(e){}
    if(!NATIVE){if(old!=null)secrets[k]=old;continue}
    let v=null;
    try{v=(await kc("get",{key:k})).value;if(v==null&&old!=null){await kc("set",{key:k,value:old});v=old}
      if(old!=null)localStorage.removeItem(k)}
    catch(e){console.error("SecureStore load failed",k,e);if(v==null)v=old}
    if(v!=null)secrets[k]=v;
  }
}
const secretsReady=loadSecrets();
const secret={
  get:k=>secrets[k]??null,
  /* resolves once saved; a null value removes it. On failure the old value comes back and it rejects. */
  set(k,v){
    const prev=secrets[k];if(v==null)delete secrets[k];else secrets[k]=v;
    const undo=e=>{if(prev==null)delete secrets[k];else secrets[k]=prev;throw e};
    if(!NATIVE){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return Promise.reject(e).catch(undo)}return Promise.resolve()}
    return chain(()=>v==null?kc("remove",{key:k}):kc("set",{key:k,value:v})).catch(undo);
  }
};
/* Face ID / Touch ID, iOS app only; the PIN is always the fallback */
const NOBIO={available:false,type:"none"};
const bio={
  available:()=>NATIVE?CAP.nativePromise("Biometric","available",{}).catch(()=>NOBIO):Promise.resolve(NOBIO),
  authenticate:(reason,state)=>NATIVE?CAP.nativePromise("Biometric","authenticate",state?{reason,state}:{reason}).catch(()=>({ok:false,reason:"failed"})):Promise.resolve({ok:false,reason:"unavailable"})
};
/* local notifications, iOS app only (null in a browser, which keeps the calendar-file alerts) */
const notify=NATIVE?{
  status:()=>CAP.nativePromise("Notify","status",{}).then(r=>r.status).catch(()=>"unavailable"),
  request:()=>CAP.nativePromise("Notify","request",{}).then(r=>r.status).catch(()=>"unavailable"),
  schedule:plan=>CAP.nativePromise("Notify","schedule",plan),
  openSettings:()=>CAP.nativePromise("Notify","openSettings",{})
}:null;
const ready=backend.load().then(r=>{store=r.store;meta=r.meta;storageOk=r.ok;return true},
  e=>{console.error("Storage load failed",e);storageOk=false;return false});

const subs=new Set();
let queued=0;
function fire(){if(queued)return;queued=setTimeout(()=>{queued=0;subs.forEach(f=>{try{f()}catch(e){console.error(e)}})},0)}
function saveMeta(){return backend.saveMeta(meta).catch(e=>console.error(e))}
/* swaps in a whole new store (restore, erase); resolves false if it couldn't be saved */
async function replaceStore(next){try{await backend.replaceAll(next)}catch(e){return false}store=next;return true}
function snap(p){const d=store[p];return{id:p.split("/").pop(),exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}}
function members(c){const n=c.split("/").length+1;return Object.keys(store).filter(k=>k.startsWith(c+"/")&&k.split("/").length===n).sort().map(snap)}
function write(p,d){
  const prev=store[p],next=d===undefined?undefined:JSON.parse(JSON.stringify(d));
  const put=v=>{if(v===undefined)delete store[p];else store[p]=v};
  put(next);
  return backend.write(p,next,store).then(()=>{meta.changes=(meta.changes||0)+1;saveMeta();fire()},e=>{
    if(store[p]===next)put(prev);
    console.error("Save failed",e);
    return Promise.reject(e&&e.code==="quota_exceeded"?e:{code:"unavailable",message:"Couldn't save on this phone"});
  });
}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function docRef(p){return{id:p.split("/").pop(),path:p,
  get:async()=>snap(p),set:d=>write(p,d),
  update:d=>store[p]?write(p,Object.assign({},store[p],d)):Promise.reject({code:"invalid_argument",message:"Missing document"}),
  delete:()=>write(p,undefined),
  onSnapshot(next){const f=()=>next(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
  collection:c=>collRef(p+"/"+c)}}
function collRef(c){return{path:c,
  doc:id=>docRef(c+"/"+(id||newId())),
  add:async d=>{const r=docRef(c+"/"+newId());await r.set(d);return r},
  get:async()=>{const docs=members(c);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}},
  onSnapshot(next){const f=()=>{const docs=members(c);next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}}
const db={doc:docRef,collection:collRef};

async function saveFile(name,data,type){
  const blob=new Blob([data],{type});
  let file=null;try{file=new File([blob],name,{type})}catch(e){}
  if(type!=="text/calendar"&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return{status:"saved"}}
    catch(e){if(e&&e.name==="AbortError")throw{code:"declined",message:"Cancelled"};}
  }
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  return{status:"saved"};
}
const downloads={save:({filename,data})=>saveFile(filename,data,/\.csv$/i.test(filename)?"text/csv":/\.ics$/i.test(filename)?"text/calendar":"application/json")};

/* ----- backup and restore ----- */
const pad=n=>String(n).padStart(2,"0");
const stamp=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
let pending=null,msg="",busy=false,wipeAsk=false;
function countTx(s){return Object.keys(s).filter(k=>/^tx\/[^/]+$/.test(k)).length}
function ago(ts){if(!ts)return"never";const d=Math.floor((Date.now()-ts)/864e5);return d<=0?"today":d===1?"yesterday":d+" days ago"}
async function backup(){
  if(busy)return;busy=true;
  const body=JSON.stringify({app:"money-tracker",format:1,exported:new Date().toISOString(),store});
  try{await saveFile("money-tracker-backup-"+stamp()+".json",body,"application/json");meta.lastBackup=Date.now();meta.changes=0;saveMeta();msg="Backup saved. Keep it in iCloud Drive so it survives a lost phone."}
  catch(e){msg=e&&e.code==="declined"?"":"Couldn't save the backup. Try again."}
  busy=false;fire();
}
function readFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let obj=null;try{obj=JSON.parse(r.result)}catch(e){}
    if(!obj||obj.app!=="money-tracker"||!obj.store||typeof obj.store!=="object"){pending=null;msg="That file isn't a Money Tracker backup.";fire();return}
    pending={store:obj.store,exported:obj.exported||"",n:countTx(obj.store)};msg="";fire();
  };
  r.onerror=()=>{msg="Couldn't read that file.";fire()};
  r.readAsText(file);
}
async function applyRestore(){
  if(!pending||busy)return;busy=true;
  const ok=await replaceStore(pending.store);busy=false;
  if(!ok){msg="Not enough space on this phone to restore.";pending=null;fire();return}
  meta.lastBackup=Date.now();meta.changes=0;saveMeta();
  msg=`Restored ${pending.n} transactions.`;pending=null;fire();
}
const when=iso=>{try{return new Date(iso).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})}catch(e){return""}};
function restoreBlock(){
  if(pending){
    const has=countTx(store);
    return `<div class="notice" style="display:flex;flex-direction:column;gap:10px">
      <span>This backup${pending.exported?" from "+when(pending.exported):""} has ${pending.n} transactions.${has?` It replaces the ${has} transactions on this phone.`:""}</span>
      <span class="btnrow"><button class="btn primary" data-act="mtyes">${has?"Replace my data":"Restore"}</button><button class="btn" data-act="mtno">Cancel</button></span></div>`;
  }
  return `<label class="btn" for="mtfile">Restore from backup</label><input type="file" id="mtfile" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">`;
}
function card(){
  const unsaved=meta.changes||0;
  return `<section class="card"><div class="head"><h2>Backup</h2><span class="small muted">Last backup ${ago(meta.lastBackup)}</span></div>
    <p class="small muted" style="margin:0 0 10px">Your data is stored only on this phone${unsaved?`, with ${unsaved} change${unsaved===1?"":"s"} since the last backup`:""}. Back up now opens your share sheet: choose <b>Save to Files → iCloud Drive</b> on iPhone, or <b>Drive</b> on Android. The app reminds you weekly, or sooner after lots of changes.</p>
    ${msg?`<p class="small" role="status" style="margin:0 0 10px;font-weight:600">${msg}</p>`:""}
    <div class="btnrow" style="position:relative"><button class="btn primary" data-act="mtbackup">Back up now</button>${restoreBlock()}</div>
    ${storageOk?"":`<p class="err" style="margin:10px 0 0">This browser is blocking storage, so nothing will be kept. Open the app from your Home Screen instead.</p>`}</section>
  <section class="card"><div class="head"><h2>Start over</h2></div>
    ${wipeAsk?`<div class="notice" style="background:var(--neg-soft);color:var(--neg);display:flex;flex-direction:column;gap:10px">
      <span><b>Erase everything on this phone?</b> All ${countTx(store)} transactions, your accounts, budgets and settings will be deleted. This can't be undone unless you have a backup.</span>
      <span class="btnrow"><button class="btn danger armed" data-act="mtwipeyes">Erase all data</button><button class="btn" data-act="mtwipeno">Cancel</button></span></div>`
    :`<p class="small muted" style="margin:0 0 10px">Delete everything on this phone and set the app up from scratch. Back up first if you might want it later.</p>
      <button class="btn danger" data-act="mtwipe">Erase all data</button>`}</section>`;
}
function nudge(){
  if(!store["app/config"])return"";
  const ch=meta.changes||0,since=meta.lastBackup?Date.now()-meta.lastBackup:Infinity;
  if(meta.snooze&&Date.now()<meta.snooze)return"";
  if(!meta.lastBackup&&ch>0&&!meta.first){meta.first=Date.now();saveMeta()}
  const fresh=!meta.lastBackup&&meta.first&&Date.now()-meta.first<3*864e5;
  const due=!fresh&&((since>7*864e5&&ch>0)||(ch>=25&&since>864e5));
  if(!due)return"";
  return `<div class="notice" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between"><span style="flex:1 1 200px"><b>${ch} change${ch===1?"":"s"} not backed up.</b> Last backup ${ago(meta.lastBackup)}. Save a copy to iCloud Drive or Google Drive so a lost phone doesn't mean lost data.</span><span style="display:flex;gap:8px"><button class="btn sm primary" data-act="mtbackup">Back up</button><button class="btn sm" data-act="mtlater">Later</button></span></div>`;
}
function firstRun(){
  return `<div class="btnrow" style="justify-content:center;position:relative;margin-top:-4px"><span class="small muted" style="align-self:center">Have a backup file?</span>${restoreBlock()}</div>${msg?`<p class="small" style="font-weight:600">${msg}</p>`:""}`;
}
/* deletes every document and the backup counters (Erase all data, Forgot PIN) */
async function eraseAll(){if(!await replaceStore({}))return false;meta={};await saveMeta();return true}
document.addEventListener("click",async e=>{
  const a=e.target.closest("[data-act]");if(!a)return;
  if(a.dataset.act==="mtbackup")backup();
  if(a.dataset.act==="mtlater"){meta.snooze=Date.now()+2*864e5;saveMeta();fire()}
  if(a.dataset.act==="mtyes")applyRestore();
  if(a.dataset.act==="mtno"){pending=null;fire()}
  if(a.dataset.act==="mtwipe"){wipeAsk=true;msg="";fire()}
  if(a.dataset.act==="mtwipeno"){wipeAsk=false;fire()}
  if(a.dataset.act==="mtwipeyes"){
    if(!await eraseAll()){msg="Couldn't erase. Try again.";wipeAsk=false;fire();return}
    try{["mt.nd","mt.sdraft","mt.txdraft","mt.setupdraft","mt.storydraft"].forEach(k=>localStorage.removeItem(k));localStorage.setItem("mt.view","home")}catch(err){}
    wipeAsk=false;msg="";pending=null;fire();window.scrollTo(0,0);
  }
});
document.addEventListener("change",e=>{if(e.target.id==="mtfile"&&e.target.files&&e.target.files[0]){readFile(e.target.files[0]);e.target.value=""}});

window.__mt={card,nudge,firstRun,eraseAll,secret,bio,notify,ready:secretsReady};
/* the database waits for the PIN settings, so the lock screen is up before any data shows */
window.claude={use:async n=>n==="db"?(await secretsReady,await ready?db:null):n==="downloads"?downloads:null};
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
})();
</script>
</head>

/* ---------- calendar reminders (.ics) ---------- */
function icsEsc(t){return String(t).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r/g,"").replace(/\n/g,"\\n")}
function icsFold(line){const out=[];let s=line;while(s.length>73){out.push(s.slice(0,73));s=" "+s.slice(73)}out.push(s);return out.join("\r\n")}
function buildIcs(cfg){
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const dt=(iso,time)=>iso.replace(/-/g,"")+"T"+(time||"09:00").replace(":","")+"00";
  const RR={week:"FREQ=WEEKLY",fortnight:"FREQ=WEEKLY;INTERVAL=2","4weeks":"FREQ=WEEKLY;INTERVAL=4",month:"FREQ=MONTHLY",quarter:"FREQ=MONTHLY;INTERVAL=3",year:"FREQ=YEARLY"};
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Money Tracker//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  const ev=(uid,start,rrule,summary,desc)=>{L.push("BEGIN:VEVENT","UID:"+uid,"DTSTAMP:"+stamp,"DTSTART:"+start,"DURATION:PT15M","RRULE:"+rrule,"SUMMARY:"+icsEsc(summary),"DESCRIPTION:"+icsEsc(desc),
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(summary),"TRIGGER:PT0M","END:VALARM","END:VEVENT")};
  let n=0;const t=today();
  for(const r of cfg.recurring||[]){
    const rm=r.remind||{};if(!rm.on||!r.anchor)continue;
    let first=r.anchor;for(let k=0;k<3000&&first<t;k++)first=occAt(r,k+1);
    const before=+rm.before||0,when=before?(before===1?"tomorrow":`in ${before} days`):"today";
    const amt=r.amount?" ("+money(r.amount)+")":"";
    const verb=r.type==="Income"?"lands":r.type==="Transfer"?"is due":"is due";
    ev(`${r.id}@money-tracker`,dt(addDays(first,-before),rm.time),RR[r.cadence]||RR.month,`${r.desc}${amt} ${verb} ${when}`,`Open Money Tracker to log it when it happens.`);n++;
  }
  const d=cfg.nudges||{};
  if(d.payCal){const p=(cfg.recurring||[]).find(r=>r.pay);if(p&&p.anchor){let first=p.anchor;for(let k=0;k<3000&&first<t;k++)first=occAt(p,k+1);
    ev("payday-goals@money-tracker",dt(first,d.payTime||"18:00"),RR[p.cadence]||RR.month,"Payday: set money aside for your goals","Open Money Tracker and tick off this pay's goal transfers.");n++}}
  for(const a of cfg.accounts||[]){if(a.kind!=="credit"||!+a.dueDay||!a.remindDue)continue;ev(`due-${String(a.name).replace(/[^A-Za-z0-9]/g,"")}@money-tracker`,dt(addDays(nextDue(+a.dueDay),-2),"09:00"),"FREQ=MONTHLY",`${a.name} payment due in 2 days`,"Pay the full balance by the due date to avoid interest.");n++}
  if(d.cal){ev("daily-checkin@money-tracker",dt(t,d.calTime||"20:00"),"FREQ=DAILY","Add today's spending",`Open Money Tracker and log anything you bought today.`);n++}
  L.push("END:VCALENDAR");
  return {text:L.map(icsFold).join("\r\n")+"\r\n",n};
}

/* ---------- phone notifications (iOS app) ---------- */
/* The same reminders as the calendar alerts, as one-off notifications for the next 60 days (the daily
   check-in repeats by itself). iOS keeps at most 64 waiting, so only the soonest are kept; the list is
   rebuilt whenever the app opens or settings are saved. hide leaves amounts off the lock screen. */
function reminderPlan(cfg,t,hm,hide){
  const items=[],end=addDays(t,60),now=t+"T"+hm;
  const add=(id,date,time,title,body)=>{const at=date+"T"+(time||"09:00");if(at>now&&date<=end)items.push({id,title,body,at})};
  for(const r of cfg.recurring||[]){
    const rm=r.remind||{};if(!rm.on||!r.anchor)continue;
    const before=+rm.before||0,when=before?(before===1?"tomorrow":`in ${before} days`):"today";
    const amt=r.amount&&!hide?" ("+money(r.amount)+")":"",verb=r.type==="Income"?"lands":"is due";
    for(let k=0;k<3000;k++){const d=occAt(r,k);if(addDays(d,-before)>end)break;if(d<t||(r.skipped||[]).includes(d))continue;
      add(`${r.id}@${d}`,addDays(d,-before),rm.time,`${r.desc}${amt} ${verb} ${when}`,"Open Money Tracker to log it when it happens.")}
  }
  const nd=cfg.nudges||{},pay=(cfg.recurring||[]).find(r=>r.pay);
  if(nd.payCal&&pay&&pay.anchor)for(let k=0;k<3000;k++){const d=occAt(pay,k);if(d>end)break;if(d<t)continue;
    add(`payday@${d}`,d,nd.payTime||"18:00","Payday: set money aside for your goals","Open Money Tracker and tick off this pay's goal transfers.")}
  for(const a of cfg.accounts||[]){if(a.kind!=="credit"||!+a.dueDay||!a.remindDue)continue;
    for(let m=0;m<4;m++){const due=dayIn(shiftMonth(ym(t),m),+a.dueDay);
      add(`due-${a.name}@${due}`,addDays(due,-2),"09:00",`${a.name} payment due in 2 days`,"Pay the full balance by the due date to avoid interest.")}}
  items.sort((a,b)=>a.at<b.at?-1:a.at>b.at?1:0);
  const daily=nd.cal?{id:"daily-checkin",title:"Add today's spending",body:"Open Money Tracker and log anything you bought today.",time:nd.calTime||"20:00"}:null;
  return {items:items.slice(0,daily?59:60),daily};
}

  for(const [name,v0] of Object.entries(b)){const a=accs.find(x=>x.name===name)||{name,kind:"everyday"};let v=v0;
    if(isSuper(a))v=superAt(a,date).worth;else if(isInv(a)){const x=invAt(a,date);if(x)v=x.worth}

  if(feat("people")){const p={};for(const t of S.tx){if(t.date>date||!/^IOU/.test(t.type))continue;const n=(t.person||"").trim()||"Someone";p[n]=(p[n]||0)+(t.type==="IOU out"?1:-1)*(+t.amount||0)}
    for(const [n,v] of Object.entries(p)){if(v>0.005){g.owedTo.push({name:n,v});assets+=v}else if(v<-0.005){g.oweTo.push({name:n,v:-v});debts+=-v}}}
  if(feat("loans")){for(const l of (S.cfg.loans||[])){const ow=loanCalc(l,date).owing;if(ow>0.005){g.loans.push({name:l.name||"Loan",v:ow});debts+=ow}}}

}

function stepErr(n){
  const t=F.type;
  if(n===1&&!(parseAmt(F.amount)>0))return"Enter an amount above zero. Amounts are always positive; the type sets the direction.";
  if(n===2){
    if((t==="Income"||t==="Expense")&&!F.category)return"Pick a category.";
    if(t==="Transfer"&&(!F.account||!F.to||F.to===F.account))return"Pick the account it comes from and a different one it goes to.";
    if(t.startsWith("IOU")&&!(F.person||"").trim())return"Add the person's name so the IOU shows on People.";
  }
  return"";
}
function nextStep(){
  readForm();const e=stepErr(F.step);if(e){F.err=e;return drawSheet()}

  drawSheet();
}
function readForm(){
  const g=id=>{const e=$(id);return e?e.value:null};
  if($("#famt"))F.amount=g("#famt");if($("#fdesc"))F.desc=g("#fdesc");
  if($("#fperson"))F.person=g("#fperson");if($("#fdate"))F.date=g("#fdate");if($("#ffx"))F.fxAmt=g("#ffx");

function autofill(desc){

}
/* link a payment logged with + to the bill it pays */
function billMatch(d,used){if(!["Expense","Transfer"].includes(d.type)&&!(used&&d.type==="Income"))return null;const norm=x=>(x||"").toLowerCase().replace(/[^a-z]+/g," ").trim(),dn=norm(d.desc),dd=Date.parse(d.date+"T00:00:00Z");
  const c=upcoming().filter(u=>{const r=u.r;if(used&&used.has(u.key))return false;if(r.type!==d.type||r.account!==d.account)return false;if(d.type==="Transfer"&&r.to!==d.to)return false;
    if((d.type==="Expense"||d.type==="Income")&&r.category!==d.category&&!(dn&&norm(r.desc)&&(dn.includes(norm(r.desc))||norm(r.desc).includes(dn))))return false;
    const win={week:3,fortnight:5}[r.cadence]||10,gap=Math.abs(Math.round((dd-Date.parse(u.d+"T00:00:00Z"))/864e5));if(gap>win&&!(u.overdue&&d.date>=u.d&&gap<=31))return false;
    const want=+r.amount||0;if(r.card)return true;return want>0&&Math.abs(d.amount-want)<=Math.max(1,want*0.2)});
  if(!c.length)return null;return c.sort((a,b)=>Math.abs(dd-Date.parse(a.d+"T00:00:00Z"))-Math.abs(dd-Date.parse(b.d+"T00:00:00Z")))[0]}
async function saveTx(again){
  readForm();
  const amt=r2(parseAmt(F.amount));
  const t=F.type;let err="";
  if(!(amt>0))err="Enter an amount above zero. Amounts are always positive; the type sets the direction.";
  else if(!F.account)err="Pick the account.";
  else if((t==="Income"||t==="Expense")&&!F.category)err="Pick a category.";
  else if(t==="Transfer"&&(!F.to||F.to===F.account))err="Pick a different account to move the money into.";
  else if(t.startsWith("IOU")&&!F.person.trim())err="Add the person's name so the IOU shows on People.";
  else if(!/^\d{4}-\d{2}-\d{2}$/.test(F.date))err="Pick a date.";
  if(err){F.err=err;const s1=stepErr(1),s2=stepErr(2);if(s1)F.step=1;else if(s2)F.step=2;drawSheet();return}
  const data={date:F.date,account:F.account,type:t,category:t==="Transfer"?"Transfer":t.startsWith("IOU")?"Lending & IOUs":F.category,
    desc:F.desc.trim(),amount:F.neg&&(t==="Expense"||t==="Income")?-amt:amt,to:t==="Transfer"?F.to:"",person:(F.person||"").trim(),created:F.created||Date.now()};
  if(F.rec)data.rec=F.rec;
  let linked=null;if(!F.id&&!F.rec&&!F.loan&&!F.noLink){linked=billMatch(data);if(linked)data.rec=linked.key}
  if(F.loan&&t==="Expense")data.loan=F.loan;
  if(t==="Expense"&&catOf(F.category)?.role==="remit"){const fa=parseAmt(F.fxAmt??(F.fx&&F.fx.amt));if(fa>0)data.fx={cur:(F.fx&&F.fx.cur)||homeCur()||"",amt:r2(fa)}}
  if(F.goal&&(t==="Transfer"?partGoalsOn([F.to,F.account]):t==="Expense"?partGoalsOn([F.account]):[]).some(g=>g.id===F.goal))data.goal=F.goal;
  /* editing: keep what the form doesn't show, so goal spending stays off the budget and imports still match */
  if(F.id){const old=S.tx.find(x=>x.id===F.id);if(old){for(const k of ["raw","imp"])if(old[k]!==undefined&&old[k]!==null)data[k]=old[k];
    if(t==="Expense"&&old.goalUse){data.goalUse=true;if(old.goalName)data.goalName=old.goalName}
    if(!data.fx&&old.fx&&t==="Expense"&&catOf(F.category)?.role==="remit"&&F.fxAmt===undefined)data.fx=old.fx}}
  /* the same amount, account and type within a day is usually a double entry: say so once, and save on the second tap */
  if(!F.id){const sig=JSON.stringify([data.account,data.type,data.amount,data.date,data.to]);if(F.dupOk!==sig){const dd=Date.parse(data.date+"T00:00:00Z");
    const twin=S.tx.find(x=>x.account===data.account&&x.type===data.type&&r2(+x.amount)===r2(data.amount)&&(x.to||"")===(data.to||"")&&Math.abs(Date.parse(x.date+"T00:00:00Z")-dd)<=864e5);
    if(twin){F.dupOk=sig;F.dup={desc:twin.desc||twin.category||twin.type,date:twin.date,amt:Math.abs(+twin.amount||0)};F.err="";drawSheet();return}}}
  try{
    if(F.id)await S.db.doc("tx/"+F.id).set(data);else await S.db.collection("tx").add(data);
    if(!F.id)LS.set("mt.txdraft",null);
    if(linked){const key=linked.key,cr=data.created;toastUndo(`Saved as the ${linked.r.desc} payment due ${shortDate(linked.d)}`,async()=>{const x=S.tx.find(y=>y.rec===key&&y.created===cr);if(!x)return;const o=Object.assign({},x);delete o.rec;delete o.id;await S.db.doc("tx/"+x.id).set(o);return"Unlinked. The bill is still due"})}
    else toast(F.id?"Changes saved":"Saved");
    if(again){const keep={type:t,account:F.account,date:F.date};openTx(keep)}else{F=null;drawSheet()}
  }catch(e){F.err=dbMsg(e);drawSheet()}
}
/* CSV cell: quote when needed, and stop text such as "=HYPERLINK(…)" from a bank description running as a formula in Excel */
function csvCell(v){if(typeof v==="number")return String(v);v=String(v??"");if(/^[=+\-@\t\r]/.test(v)&&!/^-?\d+(\.\d+)?$/.test(v))v="'"+v;return /[",\r\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function dbMsg(e){
  const c=e&&e.code;
  if(c==="quota_exceeded")return"Storage is full. Export to CSV and remove old entries, then try again.";
  if(c==="invalid_argument"||c==="transform_error")return"This change couldn't be saved. The record may be too large: try removing old goals, holdings or rules.";
  if(c==="not_granted"||c==="capability_disabled"||c==="capability_removed")return"Only the owner of this tracker can save changes.";
  if(c==="revoked")return"Access to this tracker changed. Reload the page to continue.";
  if(c==="resource_exhausted")return"Too many saves at once. Wait a moment and try again.";
  return"Couldn't save. Check your connection and try again.";
}

async function doRestore(){const rs=RS;if(!rs||!rs.d||rs.busy)return;const d=rs.d,redraw=()=>{if(RS===rs)drawRestore()};
  /* store writes go one at a time; a busy store gets a short pause and another try */
  const w=async fn=>{for(let k=0;;k++){try{return await fn()}catch(e){if(e&&e.code==="resource_exhausted"&&k<4){await new Promise(r=>setTimeout(r,1200*(k+1)));continue}throw e}}};
  const keepTx=new Set(d.tx.filter(t=>okId(t.id)).map(t=>t.id)),keepP=new Set(d.props.filter(p=>okId(p.id)).map(p=>p.id));
  const dropTx=S.tx.filter(t=>!keepTx.has(t.id)),dropP=S.props.filter(p=>!keepP.has(p.id));
  rs.busy=true;rs.prog=0;rs.total=d.tx.length+d.props.length+dropTx.length+dropP.length+1;rs.err="";redraw();
  try{for(const t of d.tx){const {id,...rest}=t;if(okId(id))await w(()=>S.db.doc("tx/"+id).set(rest));else await w(()=>S.db.collection("tx").add(rest));rs.prog++;if(rs.prog%10===0)redraw()}
    for(const p of d.props){const {id,...rest}=p;if(okId(id))await w(()=>S.db.doc("props/"+id).set(rest));else await w(()=>S.db.collection("props").add(rest));rs.prog++}
    for(const t of dropTx){await w(()=>S.db.doc("tx/"+t.id).delete());rs.prog++;if(rs.prog%10===0)redraw()}
    for(const p of dropP){await w(()=>S.db.doc("props/"+p.id).delete());rs.prog++}
    const c=JSON.parse(JSON.stringify(d.config));c.lastBackup=(S.cfg&&S.cfg.lastBackup)||c.lastBackup;await w(()=>S.db.doc("app/config").set(c));rs.prog++;
    clearDraft();LS.set("mt.txdraft",null);if(RS===rs){RS=null;clearSheet()}setCurrency(c.currency);toast(`Restored ${d.tx.length} transaction${d.tx.length===1?"":"s"}`);go("home",{tab:true})}
  catch(e){rs.busy=false;rs.armed=false;rs.err=dbMsg(e)+` The restore stopped after ${rs.prog} of ${rs.total} steps. Run it again to finish.`;redraw()}}
document.addEventListener("change",e=>{if(e.target&&e.target.id==="rsfile"&&e.target.files&&e.target.files[0]){const f=e.target.files[0];e.target.value="";openRestore(f)}});

const STORY_INCOME=/(from (my )?super|super drawdown|get paid|getting paid|i'?m paid|am paid|\bsalary\b|\bwages?\b|\bearn(s|ing)?\b|\bincome\b|take[- ]?home|\bpension\b|allowance|centrelink|jobseeker|austudy|dividends?|distributions?|side hustle|freelanc|payslip|pay ?cheque|paycheck|\bmy pay\b|\bpay is\b|\bbonus\b|commission|\breceive\b|i get \D{0,6}\d|\btips\b|\bpaid \D{0,8}\d)/;
const STORY_SAVE=/(\bsave\b|\bsaving\b|\bsavings\b|put away|put aside|set aside|\binvest(ing)?\b|\betfs?\b|\bshares\b|index fund|emergency fund|super contribution)/;
const STORY_CAD=[
  [/\b(fortnight(ly)?|every (two|2) weeks|bi-?weekly|per fortnight|a fortnight|\/fn|\bpf\b)\b/,"fortnight"],
  [/\b(every (four|4) weeks|4[- ]weekly|four[- ]weekly)\b/,"4weeks"],
  [/\b(weekly|a week|per week|each week|every week|\/wk|\/w\b|\bpw\b)/,"week"],
  [/\b(quarter(ly)?|every (three|3) months)\b/,"quarter"],
  [/\b(yearly|annual(ly)?|a year|per year|each year|every year|per annum|\bpa\b|\/yr)/,"year"],
  [/\b(daily|a day|per day|each day|every day)\b/,"day"],
  [/\b(monthly|a month|per month|each month|every month|\/mo|\bpm\b)/,"month"],
];
const STORY_PER_MONTH={day:365/12,week:52/12,fortnight:26/12,"4weeks":13/12,month:1,quarter:1/3,year:1/12};
const STORY_CAD_WORD={now:"right now",day:"a day",week:"a week",fortnight:"a fortnight","4weeks":"every 4 weeks",month:"a month",quarter:"a quarter",year:"a year"};
const STORY_FILLER=new Set("i i'm im my we our us me you your spend spent spending pay paying pays paid get gets about around roughly approx approximately on for the a an is are was per each every it it's its cost costs costing usually normally maybe like also then and of to at in total bill bills around-ish ish some on-top extra which that this goes go going comes come with from into towards toward be been have has do does is".split(" "));
function storyCadence(t){for(const [re,c] of STORY_CAD)if(re.test(t))return c;return null}
function storyStrip(t){let s=t;for(const [re] of STORY_CAD)s=s.replace(new RegExp(re.source,"g")," ");return s}
function storyAmount(t){
  const s=storyStrip(t).replace(/\b\d+\s*(weeks?|days?|months?|years?|yrs?|hours?|hrs?|times|kids|children|people|am|pm|%|x)\b/g," ");
  const re=/(?:[$£€₹¥]|\brs\.?\s*|\baud\s*|\busd\s*|\binr\s*|\bpkr\s*)?\s*(\d{1,3}(?:,\d{3})+|\d+)(?:\.(\d{1,2}))?\s*(k\b|grand\b)?/gi;
  let m;while((m=re.exec(s))){let v=parseFloat(m[1].replace(/,/g,"")+(m[2]?"."+m[2]:""));if(m[3])v*=1000;if(v>0)return v}
  return null;
}
function storyName(t){
  let s=storyStrip(t.toLowerCase()).replace(/(?:[$£€₹¥]|\brs\.?)?\s*\d[\d,]*(\.\d+)?\s*(k\b|grand\b)?/g," ").replace(/[^a-z&' -]/g," ");
  let words=s.split(/\s+/).filter(Boolean);const cut=words.findIndex((x,i)=>i>0&&/^(for|from|to|with|at|on)$/.test(x));if(cut>0)words=words.slice(0,cut);
  const w=words.filter(x=>!STORY_FILLER.has(x)).slice(0,3);
  if(!w.length)return"Other";
  const n=w.join(" ");return n.charAt(0).toUpperCase()+n.slice(1);
}
const STORY_BAL=/\b(i have|i've got|ive got|i got|have got|currently have|have about|have around|have roughly|i hold|balance|sitting|there's|there is|in the bank|saved up|already saved|already have|have saved|i owe|owe|owing|worth)\b/;
const STORY_BAL_LABEL={everyday:"Everyday account",savings:"Savings",cash:"Cash",credit:"Credit card",investment:"Investments",super:"Super",loan:"Loan"};
function parseStory(text){
  const items=[],unparsed=[];
  const sentences=String(text||"").replace(/\r/g,"").split(/[\n.;!?]+(?=\s|$)|\n/).map(x=>x.trim()).filter(Boolean);
  for(const sent of sentences){
    const sentCad=storyCadence(sent.toLowerCase());
    const raw=sent.split(/,(?!\d{3}(?!\d))|\band\b|\bplus\b|\balso\b|&|\+|\bthen\b/i).map(x=>x.trim()).filter(Boolean);
    const parts=[];let carry="";
    for(const p of raw){const piece=(carry?carry+" ":"")+p;if(storyAmount(piece)===null){carry=piece;continue}parts.push(piece);carry=""}
    if(carry){if(parts.length&&!STORY_CATS.some(([re])=>re.test(carry.toLowerCase())))parts[parts.length-1]+=" "+carry;else unparsed.push(carry)}
    for(const piece of parts){
      const low=piece.toLowerCase(),amt=storyAmount(piece);if(amt===null){unparsed.push(piece);continue}
      let cad=storyCadence(low)||sentCad||"month",amt2=amt;
      const nd=low.match(/(\d)\s*days?\b(?!\s*a\s*month)/);if(cad==="day"&&nd){amt2=amt*+nd[1];cad="week"}
      let kind,name,essential=false,akind="";
      const cat=STORY_CATS.find(([re])=>re.test(low));
      if(STORY_BAL.test(low)&&!storyCadence(low)){
        akind=/\bsuper(annuation)?\b/.test(low)?"super":/credit|card|amex|visa|mastercard/.test(low)?"credit":/loan|hecs|help debt|mortgage|\bowe\b|owing|debt/.test(low)?"loan":/invest|etf|shares|stocks|portfolio|index fund/.test(low)?"investment":/saving|emergency|term deposit|high interest|rainy/.test(low)?"savings":/\bcash\b/.test(low)?"cash":"everyday";
        items.push({on:true,kind:"Balance",akind,name:STORY_BAL_LABEL[akind],essential:false,amount:amt,cadence:"now",monthly:amt,text:piece.trim(),note:""});continue;
      }
      if(STORY_SAVE.test(low)&&!/\bloan\b|\bdebt\b/.test(low)){kind="Saving";name=/invest|etf|shares|index fund/.test(low)?"Investing":"Savings"}
      else if(STORY_INCOME.test(low)&&!(cat&&cat[2]==="Expense"&&!/(salary|wage|earn|income|pension|allowance|dividend|get paid|my pay|pay is)/.test(low))){
        kind="Income";name=cat&&cat[2]==="Income"?cat[1]:/super/.test(low)?"Super drawdown":/pension/.test(low)?"Pension":/allowance|centrelink|austudy|jobseeker/.test(low)?"Allowance":/dividend|distribution/.test(low)?"Investment income":/side hustle|freelanc|tips|uber|delivery/.test(low)?"Side income":"Wages"}
      else if(cat){kind=cat[2];name=cat[1];essential=!!cat[3]}
      else{kind="Expense";name=storyName(piece)}
      const monthly=Math.round(amt2*STORY_PER_MONTH[cad]*100)/100;
      const note=kind==="Income"&&cad==="year"&&amt2>=20000?"Is this before tax? Use your take-home pay if so.":"";
      items.push({on:true,kind,name,essential,amount:amt2,cadence:cad,monthly,text:piece.trim(),note});
    }
  }
  return {items,unparsed};
}

function wrapDb(db){const pause=()=>new Promise(r=>setTimeout(r,400+Math.random()*600));
