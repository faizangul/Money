<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Money Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF1EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1614" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>
/* On-device storage for the standalone Money Tracker.
   Provides the same small store interface the app uses (doc/collection, set/add/delete, onSnapshot),
   kept in this phone's localStorage, plus backup and restore through files. */
(function(){
"use strict";
const KEY="mt.store.v1",META="mt.meta.v1";
let store={},meta={},storageOk=true;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
try{store=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){storageOk=false;store={}}
try{meta=JSON.parse(localStorage.getItem(META)||"{}")||{}}catch(e){meta={}}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const subs=new Set();
let queued=0;
function fire(){if(queued)return;queued=setTimeout(()=>{queued=0;subs.forEach(f=>{try{f()}catch(e){console.error(e)}})},0)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store));return true}catch(e){return false}}
function saveMeta(){try{localStorage.setItem(META,JSON.stringify(meta))}catch(e){}}
function snap(p){const d=store[p];return{id:p.split("/").pop(),exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}}
function members(c){const n=c.split("/").length+1;return Object.keys(store).filter(k=>k.startsWith(c+"/")&&k.split("/").length===n).sort().map(snap)}
function write(p,d){
  const prev=store[p];
  if(d===undefined)delete store[p];else store[p]=JSON.parse(JSON.stringify(d));
  if(!persist()){if(prev===undefined)delete store[p];else store[p]=prev;return Promise.reject({code:"quota_exceeded",message:"Phone storage is full"})}
  meta.changes=(meta.changes||0)+1;saveMeta();fire();return Promise.resolve();
}
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
function docRef(p){return{id:p.split("/").pop(),path:p,
  get:async()=>snap(p),set:d=>write(p,d),
  update:d=>store[p]?write(p,Object.assign({},store[p],d)):Promise.reject({code:"invalid_argument",message:"Missing document"}),
  delete:()=>write(p,undefined),
  onSnapshot(next){const f=()=>next(snap(p));subs.add(f);setTimeout(f,0);return()=>subs.delete(f)},
  collection:c=>collRef(p+"/"+c)}}
function collRef(c){return{path:c,
  doc:id=>docRef(c+"/"+(id||newId())),
  add:async d=>{const r=docRef(c+"/"+newId());await r.set(d);return r},
  get:async()=>{const docs=members(c);return{docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}}},
  onSnapshot(next){const f=()=>{const docs=members(c);next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{}})};subs.add(f);setTimeout(f,0);return()=>subs.delete(f)}}}
const db={doc:docRef,collection:collRef};

async function saveFile(name,data,type){
  const blob=new Blob([data],{type});
  let file=null;try{file=new File([blob],name,{type})}catch(e){}
  if(type!=="text/calendar"&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return{status:"saved"}}
    catch(e){if(e&&e.name==="AbortError")throw{code:"declined",message:"Cancelled"};}
  }
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  return{status:"saved"};
}
const downloads={save:({filename,data})=>saveFile(filename,data,/\.csv$/i.test(filename)?"text/csv":/\.ics$/i.test(filename)?"text/calendar":"application/json")};

/* ----- backup and restore ----- */
const pad=n=>String(n).padStart(2,"0");
const stamp=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
let pending=null,msg="",busy=false,wipeAsk=false;
function countTx(s){return Object.keys(s).filter(k=>/^tx\/[^/]+$/.test(k)).length}
function ago(ts){if(!ts)return"never";const d=Math.floor((Date.now()-ts)/864e5);return d<=0?"today":d===1?"yesterday":d+" days ago"}
async function backup(){
  if(busy)return;busy=true;
  const body=JSON.stringify({app:"money-tracker",format:1,exported:new Date().toISOString(),store});
  try{await saveFile("money-tracker-backup-"+stamp()+".json",body,"application/json");meta.lastBackup=Date.now();meta.changes=0;saveMeta();msg="Backup saved. Keep it in iCloud Drive so it survives a lost phone."}
  catch(e){msg=e&&e.code==="declined"?"":"Couldn't save the backup. Try again."}
  busy=false;fire();
}
function readFile(file){
  const r=new FileReader();
  r.onload=()=>{
    let obj=null;try{obj=JSON.parse(r.result)}catch(e){}
    if(!obj||obj.app!=="money-tracker"||!obj.store||typeof obj.store!=="object"){pending=null;msg="That file isn't a Money Tracker backup.";fire();return}
    pending={store:obj.store,exported:obj.exported||"",n:countTx(obj.store)};msg="";fire();
  };
  r.onerror=()=>{msg="Couldn't read that file.";fire()};
  r.readAsText(file);
}
function applyRestore(){
  if(!pending)return;
  const prev=store;store=pending.store;
  if(!persist()){store=prev;msg="Not enough space on this phone to restore.";pending=null;fire();return}
  meta.lastBackup=Date.now();meta.changes=0;saveMeta();
  msg=`Restored ${pending.n} transactions.`;pending=null;fire();
}
const when=iso=>{try{return new Date(iso).toLocaleDateString("en-AU",{day:"numeric",month:"short",year:"numeric"})}catch(e){return""}};
function restoreBlock(){
  if(pending){
    const has=countTx(store);
    return `<div class="notice" style="display:flex;flex-direction:column;gap:10px">
      <span>This backup${pending.exported?" from "+when(pending.exported):""} has ${pending.n} transactions.${has?` It replaces the ${has} transactions on this phone.`:""}</span>
      <span class="btnrow"><button class="btn primary" data-act="mtyes">${has?"Replace my data":"Restore"}</button><button class="btn" data-act="mtno">Cancel</button></span></div>`;
  }
  return `<label class="btn" for="mtfile">Restore from backup</label><input type="file" id="mtfile" accept=".json,application/json" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">`;
}
function card(){
  const unsaved=meta.changes||0;
  return `<section class="card"><div class="head"><h2>Backup</h2><span class="small muted">Last backup ${ago(meta.lastBackup)}</span></div>
    <p class="small muted" style="margin:0 0 10px">Your data is stored only on this phone${unsaved?`, with ${unsaved} change${unsaved===1?"":"s"} since the last backup`:""}. Back up now opens your share sheet: choose <b>Save to Files → iCloud Drive</b> on iPhone, or <b>Drive</b> on Android. The app reminds you weekly, or sooner after lots of changes.</p>
    ${msg?`<p class="small" role="status" style="margin:0 0 10px;font-weight:600">${msg}</p>`:""}
    <div class="btnrow" style="position:relative"><button class="btn primary" data-act="mtbackup">Back up now</button>${restoreBlock()}</div>
    ${storageOk?"":`<p class="err" style="margin:10px 0 0">This browser is blocking storage, so nothing will be kept. Open the app from your Home Screen instead.</p>`}</section>
  <section class="card"><div class="head"><h2>Start over</h2></div>
    ${wipeAsk?`<div class="notice" style="background:var(--neg-soft);color:var(--neg);display:flex;flex-direction:column;gap:10px">
      <span><b>Erase everything on this phone?</b> All ${countTx(store)} transactions, your accounts, budgets and settings will be deleted. This can't be undone unless you have a backup.</span>
      <span class="btnrow"><button class="btn danger armed" data-act="mtwipeyes">Erase all data</button><button class="btn" data-act="mtwipeno">Cancel</button></span></div>`
    :`<p class="small muted" style="margin:0 0 10px">Delete everything on this phone and set the app up from scratch. Back up first if you might want it later.</p>
      <button class="btn danger" data-act="mtwipe">Erase all data</button>`}</section>`;
}
function nudge(){
  if(!store["app/config"])return"";
  const ch=meta.changes||0,since=meta.lastBackup?Date.now()-meta.lastBackup:Infinity;
  if(meta.snooze&&Date.now()<meta.snooze)return"";
  if(!meta.lastBackup&&ch>0&&!meta.first){meta.first=Date.now();try{localStorage.setItem("mt.meta.v1",JSON.stringify(meta))}catch(e){}}
  const fresh=!meta.lastBackup&&meta.first&&Date.now()-meta.first<3*864e5;
  const due=!fresh&&((since>7*864e5&&ch>0)||(ch>=25&&since>864e5));
  if(!due)return"";
  return `<div class="notice" style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between"><span style="flex:1 1 200px"><b>${ch} change${ch===1?"":"s"} not backed up.</b> Last backup ${ago(meta.lastBackup)}. Save a copy to iCloud Drive or Google Drive so a lost phone doesn't mean lost data.</span><span style="display:flex;gap:8px"><button class="btn sm primary" data-act="mtbackup">Back up</button><button class="btn sm" data-act="mtlater">Later</button></span></div>`;
}
function firstRun(){
  return `<div class="btnrow" style="justify-content:center;position:relative;margin-top:-4px"><span class="small muted" style="align-self:center">Have a backup file?</span>${restoreBlock()}</div>${msg?`<p class="small" style="font-weight:600">${msg}</p>`:""}`;
}
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-act]");if(!a)return;
  if(a.dataset.act==="mtbackup")backup();
  if(a.dataset.act==="mtlater"){meta.snooze=Date.now()+2*864e5;saveMeta();fire()}
  if(a.dataset.act==="mtyes")applyRestore();
  if(a.dataset.act==="mtno"){pending=null;fire()}
  if(a.dataset.act==="mtwipe"){wipeAsk=true;msg="";fire()}
  if(a.dataset.act==="mtwipeno"){wipeAsk=false;fire()}
  if(a.dataset.act==="mtwipeyes"){
    const prev=store;store={};
    if(!persist()){store=prev;msg="Couldn't erase. Try again.";wipeAsk=false;fire();return}
    meta={};saveMeta();try{["mt.nd","mt.sdraft","mt.txdraft","mt.setupdraft","mt.storydraft"].forEach(k=>localStorage.removeItem(k));localStorage.setItem("mt.view","home")}catch(err){}
    wipeAsk=false;msg="";pending=null;fire();window.scrollTo(0,0);
  }
});
document.addEventListener("change",e=>{if(e.target.id==="mtfile"&&e.target.files&&e.target.files[0]){readFile(e.target.files[0]);e.target.value=""}});

window.__mt={card,nudge,firstRun};
window.claude={use:async n=>n==="db"?db:n==="downloads"?downloads:null};
if("serviceWorker" in navigator&&location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
})();
</script>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column; sticky month header, scrolling cards, fixed bottom tab bar with a raised Add button. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --sunk:#F5F8F7; --ink:#13201D; --muted:#5B6A66; --line:#D5DEDB;
  --accent:#0D6B59; --accent-ink:#FFFFFF; --accent-soft:#D5EBE4;
  --pos:#1B7A4A; --neg:#B23F1A; --neg-soft:#F7E2D9; --warn:#9A6400; --warn-soft:#F6ECD4;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1614; --surface:#16211E; --sunk:#111B18; --ink:#E4EDEA; --muted:#93A39E; --line:#25332F;
  --accent:#4CC2A3; --accent-ink:#04201A; --accent-soft:#163B33;
  --pos:#5CCB8F; --neg:#F08B63; --neg-soft:#3B2219; --warn:#E2AA40; --warn-soft:#3A2E14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#16211E; --sunk:#111B18; --ink:#E4EDEA; --muted:#93A39E; --line:#25332F;
  --accent:#4CC2A3; --accent-ink:#04201A; --accent-soft:#163B33;
  --pos:#5CCB8F; --neg:#F08B63; --neg-soft:#3B2219; --warn:#E2AA40; --warn-soft:#3A2E14; color-scheme:dark}

/* Chosen look: palette x scheme. Set on <html> by script; overrides the defaults above. */
:root[data-pal="eucalyptus"][data-scheme="light"]{--bg:#EDF1EF;--surface:#FFFFFF;--sunk:#F5F8F7;--ink:#13201D;--muted:#5B6A66;--line:#D5DEDB;--accent:#0D6B59;--accent-ink:#FFFFFF;--accent-soft:#D5EBE4;--pos:#1B7A4A;--neg:#B23F1A;--neg-soft:#F7E2D9;--warn:#9A6400;--warn-soft:#F6ECD4;color-scheme:light}
:root[data-pal="eucalyptus"][data-scheme="dark"]{--bg:#0E1614;--surface:#16211E;--sunk:#111B18;--ink:#E4EDEA;--muted:#93A39E;--line:#25332F;--accent:#4CC2A3;--accent-ink:#04201A;--accent-soft:#163B33;--pos:#5CCB8F;--neg:#F08B63;--neg-soft:#3B2219;--warn:#E2AA40;--warn-soft:#3A2E14;color-scheme:dark}
:root[data-pal="harbour"][data-scheme="light"]{--bg:#EDF1F6;--surface:#FFFFFF;--sunk:#F4F6FA;--ink:#121A26;--muted:#586476;--line:#D5DCE6;--accent:#1D5DA6;--accent-ink:#FFFFFF;--accent-soft:#DAE6F5;--pos:#1B7A4A;--neg:#B23F1A;--neg-soft:#F7E2D9;--warn:#9A6400;--warn-soft:#F6ECD4;color-scheme:light}
:root[data-pal="harbour"][data-scheme="dark"]{--bg:#0C1119;--surface:#141B26;--sunk:#0F151E;--ink:#E3E9F1;--muted:#93A0B2;--line:#232F40;--accent:#6EA8EA;--accent-ink:#07182C;--accent-soft:#172A43;--pos:#5CCB8F;--neg:#F08B63;--neg-soft:#3B2219;--warn:#E2AA40;--warn-soft:#3A2E14;color-scheme:dark}
:root[data-pal="jacaranda"][data-scheme="light"]{--bg:#F1EFF5;--surface:#FFFFFF;--sunk:#F7F5FA;--ink:#1D1726;--muted:#655B72;--line:#DDD6E6;--accent:#6A3EA0;--accent-ink:#FFFFFF;--accent-soft:#E8DFF5;--pos:#1B7A4A;--neg:#B23F1A;--neg-soft:#F7E2D9;--warn:#9A6400;--warn-soft:#F6ECD4;color-scheme:light}
:root[data-pal="jacaranda"][data-scheme="dark"]{--bg:#120F19;--surface:#1B1623;--sunk:#15111C;--ink:#ECE6F3;--muted:#A297B0;--line:#2D2538;--accent:#B793E8;--accent-ink:#1B0E2E;--accent-soft:#2D2242;--pos:#5CCB8F;--neg:#F08B63;--neg-soft:#3B2219;--warn:#E2AA40;--warn-soft:#3A2E14;color-scheme:dark}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.iconbtn svg{width:18px;height:18px}
.greet{display:flex;flex-direction:column;gap:2px;padding:2px 2px 0}
.greet b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.greet span{font-size:13px;color:var(--muted)}
.nudge{display:flex;align-items:flex-start;gap:12px;background:var(--accent-soft);border-radius:12px;padding:12px 12px 12px 14px;font-size:14px}
.nudge.warn{background:var(--warn-soft)}
.nudge.bad{background:var(--neg-soft)}
.nudge p{margin:0;flex:1;min-width:0}
.nudge .x{width:28px;height:28px;font-size:15px;background:transparent;flex:none}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 12px 8px 8px;font-weight:600;font-size:14px}
.swatch i{width:26px;height:26px;border-radius:8px;display:block}
.swatch[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.remrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.remrow:first-child{border-top:0}
.remrow .opts{display:flex;gap:6px;grid-column:1/-1}
.remrow .opts select,.remrow .opts input{flex:1;min-width:0}
/* Chart colours per theme, and the Midnight theme */
:root{--c2:#6F6CD9;--c3:#E0765B;--c4:#C9A227}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c2:#ABA8F7;--c3:#F08B6E;--c4:#E6CC58}}
:root[data-theme="dark"]{--c2:#ABA8F7;--c3:#F08B6E;--c4:#E6CC58}
:root[data-pal="eucalyptus"][data-scheme="light"]{--c2:#6F6CD9;--c3:#E0765B;--c4:#C9A227}
:root[data-pal="eucalyptus"][data-scheme="dark"]{--c2:#ABA8F7;--c3:#F08B6E;--c4:#E6CC58}
:root[data-pal="harbour"][data-scheme="light"]{--c2:#2F9E8F;--c3:#E0765B;--c4:#C9A227}
:root[data-pal="harbour"][data-scheme="dark"]{--c2:#5ED1C0;--c3:#F08B6E;--c4:#E6CC58}
:root[data-pal="jacaranda"][data-scheme="light"]{--c2:#2F9E8F;--c3:#E0765B;--c4:#C9A227}
:root[data-pal="jacaranda"][data-scheme="dark"]{--c2:#5ED1C0;--c3:#F08B6E;--c4:#E6CC58}
:root[data-pal="midnight"][data-scheme="light"]{--c2:#6B68D6;--c3:#E06C55;--c4:#B89A1E}
:root[data-pal="midnight"][data-scheme="dark"]{--c2:#B4B2FF;--c3:#F2806B;--c4:#EEE87A}
:root[data-pal="midnight"][data-scheme="light"]{--bg:#F1F2ED;--surface:#FFFFFF;--sunk:#F6F7F2;--ink:#131512;--muted:#5E655B;--line:#D9DDD2;--accent:#4C7D12;--accent-ink:#FFFFFF;--accent-soft:#E2EECD;--pos:#2F7A2E;--neg:#B23F1A;--neg-soft:#F7E2D9;--warn:#9A6400;--warn-soft:#F6ECD4;color-scheme:light}
:root[data-pal="midnight"][data-scheme="dark"]{--bg:#0B0C0E;--surface:#17191C;--sunk:#111316;--ink:#F1F3EF;--muted:#8E938D;--line:#25282C;--accent:#B9EE5B;--accent-ink:#0D1006;--accent-soft:#25311A;--pos:#B9EE5B;--neg:#F2806B;--neg-soft:#3A1F1A;--warn:#EEE87A;--warn-soft:#33311A;color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(110px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:14px 10px}
header.top h1{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.01em;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.monthsw{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthsw button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted)}
.monthsw button:hover{background:var(--sunk);color:var(--ink)}
.monthsw button:disabled{opacity:.3;cursor:default}
.monthsw span{font-weight:600;font-size:14px;min-width:84px;text-align:center}

main{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h2{font-family:var(--display);font-weight:700;font-size:17px;margin:0;letter-spacing:-.005em}
.card .head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.card .head a,.linkbtn{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none;background:none;border:0;padding:0}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}

/* hero */
.hero{background:var(--accent);color:var(--accent-ink);border:0;padding:18px 18px 16px}
.hero .eyebrow{color:inherit;opacity:.8}

function netWorthAt(date){

  for(const t of S.tx){if(t.date>date)continue;const a=+t.amount||0;if(!(t.account in b))b[t.account]=0;
    if(t.type==="Income"||t.type==="IOU in")b[t.account]+=a;else b[t.account]-=a;
    if(t.type==="Transfer"&&t.to){if(!(t.to in b))b[t.to]=0;b[t.to]+=a}}
  const g={cash:[],invest:[],supers:[],superv:0,superLegacy:0,owedTo:[],cards:[],loans:[],oweTo:[]};let assets=0,debts=0;
  for(const [name,v0] of Object.entries(b)){const a=accs.find(x=>x.name===name)||{name,kind:"everyday"};let v=v0;
    if(isSuper(a))v=superAt(a,date).worth;else if(isInv(a)){const x=invAt(a,date);if(x)v=x.worth}
    if(Math.abs(v)<0.005)continue;
    if(v<0&&!isSuper(a)){debts+=-v;g.cards.push({name,v:-v,kind:a.kind})}else if(isSuper(a)){assets+=v;g.supers.push({name,v,a})}else if(isInv(a)){assets+=v;g.invest.push({name,v,a})}else{assets+=v;g.cash.push({name,v,kind:a.kind})}}
  const sup=accs.some(isSuper)?0:+fireCfg().super||0;if(sup>0){g.superLegacy=sup;assets+=sup}g.superv=r2(sup+g.supers.reduce((s2,x)=>s2+x.v,0));
  if(feat("people")){const p={};for(const t of S.tx){if(t.date>date||!/^IOU/.test(t.type))continue;const n=(t.person||"").trim()||"Someone";p[n]=(p[n]||0)+(t.type==="IOU out"?1:-1)*(+t.amount||0)}
    for(const [n,v] of Object.entries(p)){if(v>0.005){g.owedTo.push({name:n,v});assets+=v}else if(v<-0.005){g.oweTo.push({name:n,v:-v});debts+=-v}}}
  if(feat("loans")){for(const l of (S.cfg.loans||[])){const ow=loanCalc(l,date).owing;if(ow>0.005){g.loans.push({name:l.name||"Loan",v:ow});debts+=ow}}}
  if(false){const lc=roleCat("loan");for(const l of (S.cfg.loans||[])){const nm=(l.name||"").toLowerCase();
    const paid=S.tx.filter(t=>t.date<=date&&t.type==="Expense"&&t.category===lc&&nm&&(((t.person||"").toLowerCase()===nm)||(t.desc||"").toLowerCase().includes(nm))).reduce((s2,t)=>s2+(+t.amount||0),0);
    const ow=Math.max(0,(+l.balance||0)-paid);if(ow>0.005){g.loans.push({name:l.name||"Loan",v:ow});debts+=ow}}}
  return {assets:r2(assets),debts:r2(debts),net:r2(assets-debts),g};
}
function nwHistory(){
  const pts=[],first=S.tx.reduce((m,t)=>t.date<m?t.date:m,today());
  for(let i=5;i>=1;i--){const end=addDays(shiftMonth(ym(today()),-i+1)+"-01",-1);if(end>=first.slice(0,7)+"-01"||i===1)pts.push({d:end,v:netWorthAt(end).net})}

  for(let i=0;i<p.length-1;i++){const a=p[i-1]||p[i],b=p[i],c=p[i+1],e=p[i+2]||c,k=.18;

function stepErr(n){
  const t=F.type;
  if(n===1&&!(parseAmt(F.amount)>0))return"Enter an amount above zero. Amounts are always positive; the type sets the direction.";
  if(n===2){
    if((t==="Income"||t==="Expense")&&!F.category)return"Pick a category.";
    if(t==="Transfer"&&(!F.account||!F.to||F.to===F.account))return"Pick the account it comes from and a different one it goes to.";
    if(t.startsWith("IOU")&&!(F.person||"").trim())return"Add the person's name so the IOU shows on People.";
  }
  return"";
}
function nextStep(){
  readForm();const e=stepErr(F.step);if(e){F.err=e;return drawSheet()}
  F.err="";
  if(F.step===1)F.step=(F.ready&&!stepErr(2))?3:2;else F.step=3;
  drawSheet();
}
function readForm(){
  const g=id=>{const e=$(id);return e?e.value:null};
  if($("#famt"))F.amount=g("#famt");if($("#fdesc"))F.desc=g("#fdesc");
  if($("#fperson"))F.person=g("#fperson");if($("#fdate"))F.date=g("#fdate");if($("#ffx"))F.fxAmt=g("#ffx");
}
function autofill(desc){
  if(F.id)return;
  const m=knownDescs().get((desc||"").trim().toLowerCase());if(!m)return;
  if(!F.touched.type)F.type=m.type;
  if(!F.touched.category)F.category=m.category;
  if(!F.touched.account)F.account=m.account;
  if(!F.touched.to)F.to=m.to||"";
  if(!F.touched.person)F.person=m.person||"";
}
/* link a payment logged with + to the bill it pays */
function billMatch(d,used){if(!["Expense","Transfer"].includes(d.type)&&!(used&&d.type==="Income"))return null;const norm=x=>(x||"").toLowerCase().replace(/[^a-z]+/g," ").trim(),dn=norm(d.desc),dd=Date.parse(d.date+"T00:00:00Z");
  const c=upcoming().filter(u=>{const r=u.r;if(used&&used.has(u.key))return false;if(r.type!==d.type||r.account!==d.account)return false;if(d.type==="Transfer"&&r.to!==d.to)return false;
    if((d.type==="Expense"||d.type==="Income")&&r.category!==d.category&&!(dn&&norm(r.desc)&&(dn.includes(norm(r.desc))||norm(r.desc).includes(dn))))return false;
    const win={week:3,fortnight:5}[r.cadence]||10,gap=Math.abs(Math.round((dd-Date.parse(u.d+"T00:00:00Z"))/864e5));if(gap>win&&!(u.overdue&&d.date>=u.d&&gap<=31))return false;
    const want=+r.amount||0;if(r.card)return true;return want>0&&Math.abs(d.amount-want)<=Math.max(1,want*0.2)});
  if(!c.length)return null;return c.sort((a,b)=>Math.abs(dd-Date.parse(a.d+"T00:00:00Z"))-Math.abs(dd-Date.parse(b.d+"T00:00:00Z")))[0]}
async function saveTx(again){
  readForm();
  const amt=r2(parseAmt(F.amount));
  const t=F.type;let err="";
  if(!(amt>0))err="Enter an amount above zero. Amounts are always positive; the type sets the direction.";
  else if(!F.account)err="Pick the account.";
  else if((t==="Income"||t==="Expense")&&!F.category)err="Pick a category.";
  else if(t==="Transfer"&&(!F.to||F.to===F.account))err="Pick a different account to move the money into.";
  else if(t.startsWith("IOU")&&!F.person.trim())err="Add the person's name so the IOU shows on People.";
  else if(!/^\d{4}-\d{2}-\d{2}$/.test(F.date))err="Pick a date.";
  if(err){F.err=err;const s1=stepErr(1),s2=stepErr(2);if(s1)F.step=1;else if(s2)F.step=2;drawSheet();return}
  const data={date:F.date,account:F.account,type:t,category:t==="Transfer"?"Transfer":t.startsWith("IOU")?"Lending & IOUs":F.category,
    desc:F.desc.trim(),amount:F.neg&&(t==="Expense"||t==="Income")?-amt:amt,to:t==="Transfer"?F.to:"",person:(F.person||"").trim(),created:F.created||Date.now()};
  if(F.rec)data.rec=F.rec;
  let linked=null;if(!F.id&&!F.rec&&!F.loan&&!F.noLink){linked=billMatch(data);if(linked)data.rec=linked.key}
  if(F.loan&&t==="Expense")data.loan=F.loan;
  if(t==="Expense"&&catOf(F.category)?.role==="remit"){const fa=parseAmt(F.fxAmt??(F.fx&&F.fx.amt));if(fa>0)data.fx={cur:(F.fx&&F.fx.cur)||homeCur()||"",amt:r2(fa)}}
  if(F.goal&&(t==="Transfer"?partGoalsOn([F.to,F.account]):t==="Expense"?partGoalsOn([F.account]):[]).some(g=>g.id===F.goal))data.goal=F.goal;
  try{
    if(F.id)await S.db.doc("tx/"+F.id).set(data);else await S.db.collection("tx").add(data);
    if(!F.id)LS.set("mt.txdraft",null);
    if(linked){const key=linked.key,cr=data.created;toastUndo(`Saved as the ${linked.r.desc} payment due ${shortDate(linked.d)}`,async()=>{const x=S.tx.find(y=>y.rec===key&&y.created===cr);if(!x)return;const o=Object.assign({},x);delete o.rec;delete o.id;await S.db.doc("tx/"+x.id).set(o);return"Unlinked. The bill is still due"})}
    else toast(F.id?"Changes saved":"Saved");
    if(again){const keep={type:t,account:F.account,date:F.date};openTx(keep)}else{F=null;drawSheet()}
  }catch(e){F.err=dbMsg(e);drawSheet()}
}
function dbMsg(e){
  const c=e&&e.code;
  if(c==="quota_exceeded")return"Storage is full. Export to CSV and remove old entries, then try again.";
  if(c==="invalid_argument")return"Only the owner of this tracker can save changes.";
  if(c==="resource_exhausted")return"Too many saves at once. Wait a moment and try again.";
  return"Couldn't save. Check your connection and try again.";
}

  let m;while((m=re.exec(s))){let v=parseFloat(m[1].replace(/,/g,"")+(m[2]?"."+m[2]:""));if(m[3])v*=1000;if(v>0)return v}

function storyName(t){
  let s=storyStrip(t.toLowerCase()).replace(/(?:[$£€₹¥]|\brs\.?)?\s*\d[\d,]*(\.\d+)?\s*(k\b|grand\b)?/g," ").replace(/[^a-z&' -]/g," ");

}
const STORY_BAL=/\b(i have|i've got|ive got|i got|have got|currently have|have about|have around|have roughly|i hold|balance|sitting|there's|there is|in the bank|saved up|already saved|already have|have saved|i owe|owe|owing|worth)\b/;
const STORY_BAL_LABEL={everyday:"Everyday account",savings:"Savings",cash:"Cash",credit:"Credit card",investment:"Investments",super:"Super",loan:"Loan"};
function parseStory(text){
  const items=[],unparsed=[];
  const sentences=String(text||"").replace(/\r/g,"").split(/[\n.;!?]+(?=\s|$)|\n/).map(x=>x.trim()).filter(Boolean);
  for(const sent of sentences){
    const sentCad=storyCadence(sent.toLowerCase());
    const raw=sent.split(/,(?!\d{3}(?!\d))|\band\b|\bplus\b|\balso\b|&|\+|\bthen\b/i).map(x=>x.trim()).filter(Boolean);
    const parts=[];let carry="";
    for(const p of raw){const piece=(carry?carry+" ":"")+p;if(storyAmount(piece)===null){carry=piece;continue}parts.push(piece);carry=""}
    if(carry){if(parts.length&&!STORY_CATS.some(([re])=>re.test(carry.toLowerCase())))parts[parts.length-1]+=" "+carry;else unparsed.push(carry)}
    for(const piece of parts){
      const low=piece.toLowerCase(),amt=storyAmount(piece);if(amt===null){unparsed.push(piece);continue}
      let cad=storyCadence(low)||sentCad||"month",amt2=amt;
      const nd=low.match(/(\d)\s*days?\b(?!\s*a\s*month)/);if(cad==="day"&&nd){amt2=amt*+nd[1];cad="week"}
      let kind,name,essential=false,akind="";
      const cat=STORY_CATS.find(([re])=>re.test(low));
      if(STORY_BAL.test(low)&&!storyCadence(low)){
        akind=/\bsuper(annuation)?\b/.test(low)?"super":/credit|card|amex|visa|mastercard/.test(low)?"credit":/loan|hecs|help debt|mortgage|\bowe\b|owing|debt/.test(low)?"loan":/invest|etf|shares|stocks|portfolio|index fund/.test(low)?"investment":/saving|emergency|term deposit|high interest|rainy/.test(low)?"savings":/\bcash\b/.test(low)?"cash":"everyday";
        items.push({on:true,kind:"Balance",akind,name:STORY_BAL_LABEL[akind],essential:false,amount:amt,cadence:"now",monthly:amt,text:piece.trim(),note:""});continue;
      }
      if(STORY_SAVE.test(low)&&!/\bloan\b|\bdebt\b/.test(low)){kind="Saving";name=/invest|etf|shares|index fund/.test(low)?"Investing":"Savings"}
      else if(STORY_INCOME.test(low)&&!(cat&&cat[2]==="Expense"&&!/(salary|wage|earn|income|pension|allowance|dividend|get paid|my pay|pay is)/.test(low))){
        kind="Income";name=cat&&cat[2]==="Income"?cat[1]:/super/.test(low)?"Super drawdown":/pension/.test(low)?"Pension":/allowance|centrelink|austudy|jobseeker/.test(low)?"Allowance":/dividend|distribution/.test(low)?"Investment income":/side hustle|freelanc|tips|uber|delivery/.test(low)?"Side income":"Wages"}
      else if(cat){kind=cat[2];name=cat[1];essential=!!cat[3]}
      else{kind="Expense";name=storyName(piece)}
      const monthly=Math.round(amt2*STORY_PER_MONTH[cad]*100)/100;
      const note=kind==="Income"&&cad==="year"&&amt2>=20000?"Is this before tax? Use your take-home pay if so.":"";
      items.push({on:true,kind,name,essential,amount:amt2,cadence:cad,monthly,text:piece.trim(),note});
    }
  }
  return {items,unparsed};
}

    const handle=!!target.closest(".grab,.sh");if(!handle&&sh.scrollTop>2)return;st={sh,sc:sh.parentElement,x0:x,y0:y,dy:0,on:false,handle,t:0,lastY:y,lastT:Date.now(),v:0}};
  const move=(x,y,ev)=>{if(!st)return;const dy=y-st.y0,dx=x-st.x0;
    if(!st.on){if(Math.abs(dy)<8&&Math.abs(dx)<8)return;if(dy<=0||Math.abs(dx)>Math.abs(dy)||(!st.handle&&st.sh.scrollTop>2)){st=null;return}
      st.on=true;st.y0=y;st.sh.classList.add("dragging");const ae=document.activeElement;if(ae&&ae.blur&&st.sh.contains(ae))ae.blur()}
    if(ev&&ev.cancelable)ev.preventDefault();const now=Date.now();st.v=(y-st.lastY)/Math.max(1,now-st.lastT);st.lastY=y;st.lastT=now;
    st.dy=Math.max(0,y-st.y0);st.sh.style.transform=`translateY(${st.dy}px)`;const k=Math.max(0,1-st.dy/(st.sh.offsetHeight||600));st.sc.style.background=`rgba(0,0,0,${(.45*k).toFixed(3)})`};
  const end=()=>{if(!st)return;const s0=st;st=null;if(!s0.on)return;const sh=s0.sh;sh.classList.remove("dragging");
    if(s0.dy>Math.min(120,sh.offsetHeight*.28)||(s0.v>.35&&s0.dy>36)){sh.style.transition="transform .22s cubic-bezier(.4,0,1,1)";sh.style.transform="translateY(105%)";s0.sc.style.transition="background .22s";s0.sc.style.background="rgba(0,0,0,0)";
      setTimeout(()=>{if(sh.isConnected){stashSheets();const h2=$("#sheetHost");F=null;P=null;V=null;W=null;Y=null;N=false;G=null;E=false;K=null;Q=null;SF=false;h2.innerHTML=""}},210)}
    else{sh.style.transition="transform .3s cubic-bezier(.2,1.3,.4,1)";sh.style.transform="";s0.sc.style.transition="background .3s";s0.sc.style.background="";setTimeout(()=>{sh.style.transition="";s0.sc.style.transition=""},320)}};
  host.addEventListener("touchstart",e=>{if(e.touches.length===1)start(e.touches[0].clientX,e.touches[0].clientY,e.target)},{passive:true});
  host.addEventListener("touchmove",e=>{if(st&&e.touches.length===1)move(e.touches[0].clientX,e.touches[0].clientY,e)},{passive:false});
  host.addEventListener("touchend",end);host.addEventListener("touchcancel",end);
  host.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse"||!e.target.closest(".grab,.sh")||e.target.closest("button"))return;start(e.clientX,e.clientY,e.target);
    const mm=ev=>move(ev.clientX,ev.clientY,ev),mu=()=>{window.removeEventListener("pointermove",mm);window.removeEventListener("pointerup",mu);end()};window.addEventListener("pointermove",mm);window.addEventListener("pointerup",mu)});
})();
/* keep the page still while a sheet is open */
(()=>{const host=$("#sheetHost");let locked=false,y=0;
  const upd=()=>{const open=!!host.querySelector(".sheet"),b=document.body.style,r=document.documentElement.style;
    if(open&&!locked){y=window.scrollY;b.position="fixed";b.top=-y+"px";b.left="0";b.right="0";b.width="100%";r.overflow="hidden";locked=true}
    else if(!open&&locked){b.position="";b.top="";b.left="";b.right="";b.width="";r.overflow="";locked=false;window.scrollTo(0,y)}};
  new MutationObserver(()=>{upd();const sh=host.querySelector(".sheet.enter,.sheet.fromfan");if(sh&&!sh.dataset.counted){sh.dataset.counted="1";runCounts(sh)}}).observe(host,{childList:true});
  const so=window.scrollTo.bind(window);window.scrollTo=function(x,yy){if(locked&&typeof x==="number"){y=yy||0;return}return so.apply(window,arguments)}})();
async function boot(){
  render();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){db=null}
  if(!db){S.state="nodb";render();return}
  S.db=db;
  try{S.dl=await window.claude.use("downloads")}catch(e){S.dl=null}
  subscribe(db);
}
boot();
})();
